<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowry · Rive Loading Animation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#242238;background:#f7f7fb}
main{text-align:center;width:min(94vw,540px);padding:28px}
.stage{margin:18px auto;max-width:380px;aspect-ratio:1;display:grid;place-items:center;border-radius:18px;background-color:white;background-image:linear-gradient(45deg,#e8e8ef 25%,transparent 25%),linear-gradient(-45deg,#e8e8ef 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e8ef 75%),linear-gradient(-45deg,transparent 75%,#e8e8ef 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
canvas{width:100%;height:100%;background:transparent}
button{border:1px solid #dad9e6;border-radius:10px;padding:9px 14px;background:white;cursor:pointer}
small{display:block;margin-top:16px;color:#59566a}
</style></head>
<body><main><h1>Flowry loading animation</h1><div class="stage"><canvas id="rive" width="760" height="760"></canvas></div><button id="restart">Restart</button> <button id="toggle">Pause</button><small id="status">Loading Rive animation…</small></main>
<script src="https://unpkg.com/@rive-app/canvas@2.34.0"></script>
<script>
const status=document.getElementById('status');
if(!window.rive){status.textContent='Unable to load Rive runtime';}
else{
let player=new rive.Rive({src:'./animatedLoading.riv',canvas:document.getElementById('rive'),autoplay:true,layout:new rive.Layout({fit:rive.Fit.Contain,alignment:rive.Alignment.Center}),onLoad:()=>{player.resizeDrawingSurfaceToCanvas();status.textContent='Transparent Rive canvas · latest approved Flowry loader';},onLoadError:e=>{status.textContent='Could not load animatedLoading.riv. '+String(e);}});
document.getElementById('restart').onclick=()=>player.reset();
document.getElementById('toggle').onclick=()=>{if(player.isPlaying){player.pause();document.getElementById('toggle').textContent='Play';}else{player.play();document.getElementById('toggle').textContent='Pause';}};
}
</script></body></html>
